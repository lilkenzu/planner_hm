<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик встреч</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
  <h1>Планировщик встреч</h1>
  <p class="page-subtitle">Добавьте участников из разных часовых поясов — инструмент покажет, когда команде удобно созвониться на ближайшей неделе.</p>
</header>

<main class="layout">
  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">Участник</h2>
    <form id="participant-form" novalidate>
      <div class="field">
        <label for="name-input">Имя</label>
        <input type="text" id="name-input" name="name" autocomplete="off">
        <span class="field-error" id="name-error" role="alert"></span>
      </div>

      <div class="field city-field">
        <label for="city-input">Город</label>
        <input type="text" id="city-input" name="city" autocomplete="off" placeholder="Начните вводить название города">
        <div class="suggestions" id="city-suggestions" hidden></div>
        <span class="field-error" id="city-error" role="alert"></span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="start-time">Рабочий день с</label>
          <input type="time" id="start-time" name="startTime" value="09:00">
        </div>
        <div class="field">
          <label for="end-time">до</label>
          <input type="time" id="end-time" name="endTime" value="18:00">
        </div>
      </div>
      <span class="field-error" id="time-error" role="alert"></span>

      <fieldset class="field days-field">
        <legend>Рабочие дни</legend>
        <div class="days-grid" id="days-grid"></div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" id="submit-btn">Добавить участника</button>
        <button type="button" id="cancel-btn" hidden>Отменить</button>
      </div>
    </form>
  </section>

  <section class="panel" aria-labelledby="list-title">
    <h2 id="list-title">Участники</h2>
    <div id="participants-list" class="participants-list"></div>
  </section>
</main>

<script src="availability.js"></script>
<script src="app.js"></script>
</body>
</html>
